<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content class="menu-content">
        <div class="menu-shell">
          <ion-list id="main-menu-list">
            <ion-list-header>Actividad de Ionic</ion-list-header>
            <ion-note>Aplicacion con Angular, tema y tres vistas.</ion-note>

            @for (p of appPages; track p; let i = $index) {
              <ion-menu-toggle auto-hide="false">
                <ion-item routerDirection="root" [routerLink]="[p.url]" lines="none" detail="false" routerLinkActive="selected">
                  <ion-icon aria-hidden="true" slot="start" [ios]="p.icon + '-outline'" [md]="p.icon + '-sharp'"></ion-icon>
                  <ion-label>{{ p.title }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            }
          </ion-list>

          <div class="menu-settings">
            <ion-item lines="none" class="theme-toggle">
              <ion-icon aria-hidden="true" slot="start" [ios]="darkMode ? 'moon-outline' : 'sunny-outline'" [md]="darkMode ? 'moon-sharp' : 'sunny-sharp'"></ion-icon>
              <ion-label>Tema oscuro</ion-label>
              <ion-toggle slot="end" [checked]="darkMode" (ionChange)="toggleDarkMode($event)"></ion-toggle>
            </ion-item>

            <ion-item lines="none" class="font-control">
              <ion-icon aria-hidden="true" slot="start" name="text-outline"></ion-icon>
              <ion-label>Tamano de texto</ion-label>
              <ion-buttons slot="end">
                <ion-button (click)="decreaseFont()" title="Reducir texto">A-</ion-button>
                <ion-button (click)="increaseFont()" title="Aumentar texto">A+</ion-button>
              </ion-buttons>
            </ion-item>

            <ion-item lines="none" class="accent-control">
              <ion-icon aria-hidden="true" slot="start" name="color-palette-outline"></ion-icon>
              <ion-label>Color de acento</ion-label>
            </ion-item>
            <div class="accent-swatches">
              @for (color of accentColors; track color.value) {
                <button
                  type="button"
                  class="accent-dot"
                  [class.active]="accent === color.value"
                  [style.background]="color.value"
                  [title]="color.name"
                  (click)="setAccent(color.value)">
                </button>
              }
            </div>
          </div>
        </div>
      </ion-content>
    </ion-menu>
    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
